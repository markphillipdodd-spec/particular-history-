<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confessional Comparison Viewer</title>
<link rel="stylesheet" href="../styles.css">
<style>
  .compare-container {
    display: flex;
    gap: 2rem;
    max-width: 1400px;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  .compare-column {
    flex: 1;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(181, 139, 58, 0.15);
    border-radius: 8px;
    padding: 1.5rem;
    max-height: 85vh;
    overflow-y: auto;
  }
  .compare-column h2 {
    color: var(--gold, #b58b3a);
    border-bottom: 2px solid rgba(181, 139, 58, 0.3);
    padding-bottom: 0.5rem;
    margin-top: 0;
  }
  .highlight-chapter {
    background: rgba(181, 139, 58, 0.08);
    border-left: 4px solid var(--gold, #b58b3a);
    padding: 0.5rem 1rem;
    border-radius: 0 4px 4px 0;
  }
  @media (max-width: 768px) {
    .compare-container { flex-direction: column; }
    .compare-column { max-height: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><a href="../index.html">Particular History</a></div>
  
  <main class="compare-container">
    <!-- Left Column: Always the 1689 Confession -->
    <section class="compare-column" id="leftColumn">
      <h2>Second London Confession (1689)</h2>
      <div id="leftContent">Loading text...</div>
    </section>

    <!-- Right Column: Dynamically Loaded Source -->
    <section class="compare-column" id="rightColumn">
      <h2 id="rightTitle">Comparison Text</h2>
      <div id="rightContent">Loading text...</div>
    </section>
  </main>
</div>

<script>
async function initComparison() {
  const params = new URLSearchParams(window.location.search);
  const target = params.get('target');     // 'westminster' or 'savoy'
  const chapterId = params.get('chapter');  // e.g., 'chapter-1'

  if (!target || !chapterId) {
    document.getElementById('leftContent').innerHTML = '<p>No comparison parameters provided.</p>';
    document.getElementById('rightContent').innerHTML = '<p>Please navigate here from the 1689 timeline.</p>';
    return;
  }

  // Set up file map references
  const files = {
    'westminster': { name: 'Westminster Confession (1646)', url: 'westminster-confession-1646.html' },
    'savoy': { name: 'Savoy Declaration (1648)', url: 'savoy-declaration-1648.html' }
  };

  const rightSource = files[target];
  if (!rightSource) return;
  document.getElementById('rightTitle').textContent = rightSource.name;

  try {
    // 1. Fetch and render the 1689 text locally
    const response1689 = await fetch('second-london-confession-1689.html');
    const html1689 = await response1689.text();
    renderExtractedContent(html1689, 'leftContent', chapterId);

    // 2. Fetch and render the historical source text
    const responseTarget = await fetch(rightSource.url);
    const htmlTarget = await responseTarget.text();
    renderExtractedContent(htmlTarget, 'rightContent', chapterId);
  } catch (err) {
    console.error("Error loading texts:", err);
  }
}

function renderExtractedContent(rawHtml, containerId, activeChapterId) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(rawHtml, 'text/html');
  const targetContainer = document.getElementById(containerId);
  
  // Extract all the chapters or details items from the document source
  const chapters = doc.querySelectorAll('details.chapter');
  
  if (chapters.length === 0) {
    targetContainer.innerHTML = '<p>Error parsing file content blocks.</p>';
    return;
  }

  targetContainer.innerHTML = ''; // Clear loading notification
  
  chapters.forEach(ch => {
    // Clone node so we can alter layouts without mutations
    const clone = ch.cloneNode(true);
    
    // Force open the chapters so the text is fully viewable side-by-side
    clone.setAttribute('open', '');
    
    // Clean up any inner interactive connection buttons inside the target text
    const tools = clone.querySelector('.chapter-tools');
    if (tools) tools.remove();
    const innerConnections = clone.querySelector('[data-chapter-connections]');
    if (innerConnections) innerConnections.remove();

    // Highlight and prepare scrolling targets for the selected active link chapter
    if (clone.id === activeChapterId) {
      clone.classList.add('highlight-chapter');
      targetContainer.appendChild(clone);
      
      // Smoothly autoscroll the wrapper straight to the requested entry node
      setTimeout(() => {
        clone.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 150);
    } else {
      targetContainer.appendChild(clone);
    }
  });
}

// Fire the pipeline engine once the elements stand ready
window.addEventListener('DOMContentLoaded', initComparison);
</script>
</body>
</html>
